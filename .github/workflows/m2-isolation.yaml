name: m2-isolation

on:
  push:
    branches: [main]
    paths:
      - m2-isolation/**
      - .github/workflows/m2-isolation.yaml
  pull_request:
    paths:
      - m2-isolation/**
      - .github/workflows/m2-isolation.yaml
  workflow_dispatch:

concurrency:
  group: m2-isolation-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Submission archive name: <student_id_1>_<student_id_2>..<student_id_n>.zip
      ZIP_NAME: 1210891_1221294_1240374_1250446.zip
    steps:
      - uses: actions/checkout@v7

      # Build the archive from git-tracked files only, so local temp/lock
      # files are excluded by construction.
      - name: Build submission ZIP
        run: |
          git archive --format=zip --prefix=m2-isolation/ \
            -o "$ZIP_NAME" HEAD:m2-isolation

      - name: Upload submission artifact
        uses: actions/upload-artifact@v7
        with:
          name: m2-isolation-submission
          path: ${{ env.ZIP_NAME }}

      # Rolling release: always the submission built from the latest push to
      # main, at releases/download/m2-isolation/<student ids>.zip
      - name: Publish submission release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete m2-isolation --cleanup-tag --yes || true
          gh release create m2-isolation "$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "M2 - Isolation project submission" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
