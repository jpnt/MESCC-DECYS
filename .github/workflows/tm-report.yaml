name: tm-report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tm-report
    steps:
      - uses: actions/checkout@v7

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install typst
        uses: typst-community/setup-typst@v5

      - name: Generate DFDs and compile report
        run: make report

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: appshield-threat-model-report
          path: tm-report/report.pdf
