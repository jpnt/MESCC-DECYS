name: m3-threat-modeling

on:
  push:
    branches: [main]
    paths:
      - m3-threat-modeling/**
      - .github/workflows/m3-threat-modeling.yaml
  pull_request:
    paths:
      - m3-threat-modeling/**
      - .github/workflows/m3-threat-modeling.yaml
  workflow_dispatch:

concurrency:
  group: m3-threat-modeling-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: m3-threat-modeling/tm-report
    steps:
      - uses: actions/checkout@v7

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install typst
        uses: typst-community/setup-typst@v5

      - name: Run pytm models and compile report
        run: make report

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: appshield-threat-model-report
          path: m3-threat-modeling/tm-report/report.pdf

      # Rolling release: always the report built from the latest push to main,
      # at releases/download/m3-threat-modeling/appshield-threat-model.pdf
      - name: Publish report release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp report.pdf appshield-threat-model.pdf
          gh release delete m3-threat-modeling --cleanup-tag --yes || true
          gh release create m3-threat-modeling appshield-threat-model.pdf \
            --target "$GITHUB_SHA" \
            --title "M3 - AppShield threat model report" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
