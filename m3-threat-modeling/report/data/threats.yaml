- id: T52
  name: Input injected or display falsified
  stride: T
  mode: boot
  lv1: ["b:F2", "b:F1", "b:F3"]
  lv2: Flows 2, 5, 6 and 15
  desc: >-
    The keyboard and video path belong to the compromised machine. Injected
