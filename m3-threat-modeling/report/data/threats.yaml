- id: T53
  name: Crafted disk structures run code in the host
  stride: E
  mode: boot
  lv1: ["b:HC", "b:F7", "b:F9"]
  lv2: 2.2 Raw Disk Reader, 2.3 Registry Hive Parser
  desc: >-
    In this mode the host parses NTFS and registry hive structures itself. A
    crafted structure, such as a broken MFT record, a looping hive cell or a
    huge run list, corrupts memory in C++ code running with full rights inside
    the trusted environment.
  assets: ["4.3", "4.6"]
  refs: CWE-787
  cite: [cwe]
  dread: [10, 4, 4, 4, 3]
  mit: [M7]
  profile: Partially
  residual: A parser bug in a new structure is always possible.

- id: T54
  name: Compromised host process lies to the console
  stride: T
  mode: boot
  lv1: ["b:F5", "b:HC"]
  lv2: Flow 10, 2.1 Request Handler to 1.3 Host Connector
  desc: >-
    Once the host process is compromised through T53, it can send the console
    any integrity data it likes over the local channel. Both run inside the
    trusted environment, so nothing questions it.
  assets: ["4.1", "4.6"]
  dread: [10, 4, 3, 4, 3]
  mit: [M7]
  profile: Partially
  residual: Isolation limits the damage; a compromised parser can still report false data for the machine it reads.

