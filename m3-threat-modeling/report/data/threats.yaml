- id: T51
  name: Keyboard captured by the compromised machine
  stride: I
  mode: boot
  lv1: ["b:F1", "b:F3"]
  lv2: Flows 1, 5 and 15
  desc: >-
    The operator types on the compromised machine's own keyboard. A hardware
